
name: CloudRecover API Deploy

on:
  workflow_run:
    workflows:
      - CloudRecover API CI
    branches:
      - main
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: cloudrecover-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest
    environment: production

    permissions:
      actions: read
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Validate deployment settings
        shell: bash
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail

          for name in AWS_REGION EC2_INSTANCE_ID ARTIFACT_BUCKET DEPLOY_SHA AWS_DEPLOY_ROLE_ARN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing deployment setting: $name"
              exit 1
            fi
          done

      - name: Download artifact from successful CI run
        uses: actions/download-artifact@v4
        with:
          name: cloudrecover-api-${{ github.event.workflow_run.head_sha }}
          path: release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify release archive
        id: release
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="release/cloudrecover-api-${DEPLOY_SHA}.tar.gz"
          test -f "$ARCHIVE"

          PRISMA_VERSION="$(
            tar -xOf "$ARCHIVE" package-lock.json |
              jq -er '.packages["node_modules/prisma"].version'
          )"

          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "prisma-version=$PRISMA_VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload release to S3
        shell: bash
        env:
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: |
          set -euo pipefail

          aws s3 cp "$ARCHIVE" \
            "s3://${ARTIFACT_BUCKET}/cloudrecover-api/${DEPLOY_SHA}.tar.gz" \
            --sse AES256

      - name: Start deployment through Systems Manager
        id: ssm
        shell: bash
        env:
          PRISMA_VERSION: ${{ steps.release.outputs.prisma-version }}
        run: |
          set -euo pipefail

          SCRIPT_FILE="$RUNNER_TEMP/deploy-cloudrecover.sh"

          cat > "$SCRIPT_FILE" <<'REMOTE_SCRIPT'
          set -eu

          APP_ROOT="/opt/cloudrecover-api"
          ENV_FILE="$APP_ROOT/.env"
          RELEASE_DIR="$APP_ROOT/releases/$DEPLOY_SHA"
          ARCHIVE="/tmp/cloudrecover-api-$DEPLOY_SHA.tar.gz"

          test -f "$ENV_FILE"
          command -v aws >/dev/null
          command -v node >/dev/null
          command -v npm >/dev/null
          command -v curl >/dev/null
          command -v systemctl >/dev/null

          # The EC2 instance profile must allow s3:GetObject
          # for the CloudRecover release artifact prefix.
          aws s3 cp \
            "s3://$DEPLOY_BUCKET/cloudrecover-api/$DEPLOY_SHA.tar.gz" \
            "$ARCHIVE"

          mkdir -p "$RELEASE_DIR"
          tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"

          test -f "$RELEASE_DIR/package.json"
          test -f "$RELEASE_DIR/package-lock.json"
          test -f "$RELEASE_DIR/prisma.config.ts"

          # Keep the production database credentials outside
          # the release artifact and link them into each release.
          ln -sfn "$ENV_FILE" "$RELEASE_DIR/.env"

          cd "$RELEASE_DIR"

          echo "Installing production dependencies..."
          npm ci --omit=dev

          # Install the CLI version pinned by the tested lockfile.
          npm install --no-save --package-lock=false --omit=dev \
            "prisma@$DEPLOY_PRISMA_VERSION" dotenv

          echo "Generating Prisma Client..."
          npx prisma generate

          # Prisma migrations require sslmode=require for the CLI.
          # Keep the persistent application DATABASE_URL unchanged.
          MIGRATION_DATABASE_URL="$(
            node -e '
              require("dotenv").config({ path: process.env.ENV_FILE });
              if (!process.env.DATABASE_URL) {
                throw new Error("DATABASE_URL is missing");
              }
              const url = new URL(process.env.DATABASE_URL);
              url.searchParams.set("sslmode", "require");
              process.stdout.write(url.toString());
            '
          )"

          echo "Applying database migrations..."
          DATABASE_URL="$MIGRATION_DATABASE_URL" npx prisma migrate deploy

          # The systemd unit must use:
          # WorkingDirectory=/opt/cloudrecover-api/current
          PREVIOUS_RELEASE="$(readlink -f "$APP_ROOT/current" || true)"

          echo "Switching to release $DEPLOY_SHA..."
          ln -sfnT "$RELEASE_DIR" "$APP_ROOT/current"

          if ! systemctl restart cloudrecover-api.service; then
            echo "Service restart failed; attempting rollback."

            if [ -n "$PREVIOUS_RELEASE" ]; then
              ln -sfnT "$PREVIOUS_RELEASE" "$APP_ROOT/current"
              systemctl restart cloudrecover-api.service || true
            fi

            exit 1
          fi

          READY=0
          for ATTEMPT in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:3000/health/ready; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Readiness check failed; collecting service logs."
            journalctl -u cloudrecover-api.service -n 100 --no-pager || true

            if [ -n "$PREVIOUS_RELEASE" ]; then
              ln -sfnT "$PREVIOUS_RELEASE" "$APP_ROOT/current"
              systemctl restart cloudrecover-api.service || true
            fi

            exit 1
          fi

          echo "CloudRecover release $DEPLOY_SHA is healthy."
          REMOTE_SCRIPT

          jq -n \
            --arg sha "$DEPLOY_SHA" \
            --arg bucket "$ARTIFACT_BUCKET" \
            --arg prisma "${{ steps.release.outputs.prisma-version }}" \
            --arg env_file "/opt/cloudrecover-api/.env" \
            --rawfile script "$SCRIPT_FILE" \
            '{
              commands: [
                "export DEPLOY_SHA=" + ($sha | @sh) +
                " DEPLOY_BUCKET=" + ($bucket | @sh) +
                " DEPLOY_PRISMA_VERSION=" + ($prisma | @sh) +
                " ENV_FILE=" + ($env_file | @sh) +
                "\n" + $script
              ]
            }' > "$RUNNER_TEMP/ssm-parameters.json"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy CloudRecover API $DEPLOY_SHA" \
            --timeout-seconds 900 \
            --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
            --query 'Command.CommandId' \
            --output text)"

          echo "command-id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment and report failures
        shell: bash
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command-id }}
        run: |
          set -euo pipefail

          for i in $(seq 1 90); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")"

            echo "SSM deployment status: $STATUS"

            case "$STATUS" in
              Success)
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "SSM deployment did not finish within 15 minutes."
          exit 1
