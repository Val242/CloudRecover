name: CloudRecover - DR Failover

on:
  workflow_dispatch:
    inputs:
      snapshot_identifier:
        description: 'Source RDS snapshot identifier in the primary region (used if no recovery copy exists)'
        required: true
        type: string

      action_type:
        description: 'Terraform operation'
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

      confirm_recovery:
        description: 'Confirm that this is an authorized recovery operation'
        required: true
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: cloudrecover-recovery
  cancel-in-progress: false

env:
  PRIMARY_REGION: ${{ vars.PRIMARY_REGION || 'eu-west-1' }}
  DR_REGION: ${{ vars.DR_REGION }}
  TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
  TF_VERSION: ${{ vars.TF_VERSION }}
  TF_WORKING_DIR: infrastructure/secondary

jobs:
  dr-recovery:
    name: Execute DR Recovery
    runs-on: ubuntu-latest
    timeout-minutes: 360

    environment: recovery

    defaults:
      run:
        working-directory: infrastructure/secondary

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Recovery Confirmation
        run: |
          if [[ "${{ inputs.confirm_recovery }}" != "true" ]]; then
            echo "Recovery confirmation is required."
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.DR_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Reuse or Copy Recovery Snapshot
        id: recovery_snapshot
        env:
          SOURCE_SNAPSHOT_IDENTIFIER: ${{ inputs.snapshot_identifier }}
        run: |
          set -euo pipefail

          RECOVERY_SNAPSHOT_IDENTIFIER="cloudrecover-recovery-snapshot"

          get_snapshot_status() {
            aws rds describe-db-snapshots \
              --region "$1" \
              --filters "Name=db-snapshot-id,Values=$2" \
              --query 'DBSnapshots[0].Status' \
              --output text
          }

          DESTINATION_STATUS=$(get_snapshot_status "$DR_REGION" "$RECOVERY_SNAPSHOT_IDENTIFIER")

          if [[ "$DESTINATION_STATUS" == "available" ]]; then
            echo "Reusing available snapshot $RECOVERY_SNAPSHOT_IDENTIFIER in $DR_REGION."
          else
            if [[ "$DESTINATION_STATUS" == "None" || -z "$DESTINATION_STATUS" ]]; then
              SOURCE_STATUS=$(get_snapshot_status "$PRIMARY_REGION" "$SOURCE_SNAPSHOT_IDENTIFIER")

              if [[ "$SOURCE_STATUS" != "available" ]]; then
                echo "Source snapshot $SOURCE_SNAPSHOT_IDENTIFIER is not available in $PRIMARY_REGION (status: $SOURCE_STATUS)." >&2
                exit 1
              fi

              SOURCE_SNAPSHOT_ARN=$(aws rds describe-db-snapshots \
                --region "$PRIMARY_REGION" \
                --filters "Name=db-snapshot-id,Values=$SOURCE_SNAPSHOT_IDENTIFIER" \
                --query 'DBSnapshots[0].DBSnapshotArn' \
                --output text)

              echo "Copying $SOURCE_SNAPSHOT_IDENTIFIER from $PRIMARY_REGION to $DR_REGION as $RECOVERY_SNAPSHOT_IDENTIFIER."
              aws rds copy-db-snapshot \
                --source-db-snapshot-identifier "$SOURCE_SNAPSHOT_ARN" \
                --target-db-snapshot-identifier "$RECOVERY_SNAPSHOT_IDENTIFIER" \
                --source-region "$PRIMARY_REGION" \
                --region "$DR_REGION" \
                --copy-tags
            else
              echo "Recovery snapshot exists in $DR_REGION with status '$DESTINATION_STATUS'; waiting for it to become available."
            fi

            START_TIME=$(date +%s)
            while true; do
              DESTINATION_STATUS=$(get_snapshot_status "$DR_REGION" "$RECOVERY_SNAPSHOT_IDENTIFIER")

              if [[ "$DESTINATION_STATUS" == "available" ]]; then
                echo "Recovery snapshot $RECOVERY_SNAPSHOT_IDENTIFIER is available in $DR_REGION."
                break
              fi

              if [[ "$DESTINATION_STATUS" == "failed" || "$DESTINATION_STATUS" == "deleted" || "$DESTINATION_STATUS" == "None" ]]; then
                echo "Recovery snapshot copy cannot be used (status: $DESTINATION_STATUS)." >&2
                exit 1
              fi

              if (( $(date +%s) - START_TIME >= 18000 )); then
                echo "Timed out waiting for recovery snapshot to become available; last status: $DESTINATION_STATUS." >&2
                exit 1
              fi

              echo "Recovery snapshot status: $DESTINATION_STATUS. Checking again in 30 seconds."
              sleep 30
            done
          fi

          RECOVERY_POINT=$(aws rds describe-db-snapshots \
            --region "$DR_REGION" \
            --filters "Name=db-snapshot-id,Values=$RECOVERY_SNAPSHOT_IDENTIFIER" \
            --query 'DBSnapshots[0].SnapshotCreateTime' \
            --output text)
          echo "Terraform will restore recovery snapshot $RECOVERY_SNAPSHOT_IDENTIFIER, created at $RECOVERY_POINT."
          echo "snapshot_identifier=$RECOVERY_SNAPSHOT_IDENTIFIER" >> "$GITHUB_OUTPUT"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$TF_STATE_REGION" \
            -backend-config="use_lockfile=true"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: inputs.action_type == 'plan'
        run: |
          terraform plan \
            -no-color \
            -var="region=$DR_REGION" \
            -var="snapshot_identifier=${{ steps.recovery_snapshot.outputs.snapshot_identifier }}"

      - name: Terraform Apply
        if: inputs.action_type == 'apply'
        run: |
          terraform apply \
            -auto-approve \
            -no-color \
            -var="region=$DR_REGION" \
            -var="snapshot_identifier=${{ steps.recovery_snapshot.outputs.snapshot_identifier }}"
