name: CloudRecover - DR Failover

on:
  workflow_dispatch:
    inputs:
      snapshot_identifier:
        description: 'Optional source RDS snapshot identifier. If omitted, the workflow selects the latest available snapshot for the primary DB instance.'
        required: false
        type: string

      action_type:
        description: 'Terraform operation. Alarm-triggered recovery defaults to apply; choose plan for a manual validation run.'
        required: false
        type: choice
        options:
          - plan
          - apply
        default: apply

      trigger_source:
        description: 'What triggered disaster recovery'
        required: true
        type: string

      alarm_name:
        description: 'CloudWatch alarm name'
        required: true
        type: string

      source_region:
        description: 'Primary AWS region'
        required: true
        type: string

      recovery_region:
        description: 'Recovery AWS region'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: cloudrecover-recovery
  cancel-in-progress: false

jobs:
  dr-recovery:
    name: Execute DR Recovery
    runs-on: ubuntu-latest
    timeout-minutes: 360

    environment: recovery

    env:
      PRIMARY_REGION: ${{ inputs.source_region }}
      DR_REGION: ${{ inputs.recovery_region }}
      SOURCE_DB_INSTANCE_IDENTIFIER: mydb
      TRIGGER_SOURCE: ${{ inputs.trigger_source }}
      ALARM_NAME: ${{ inputs.alarm_name }}
      TF_STATE_REGION: eu-west-1
      TF_STATE_BUCKET: tinoscriptdevops
      TF_STATE_KEY: cloudrecover/secondary/terraform.tfstate
      TF_VERSION: 1.16.3
      APP_PUBLIC_KEY_PATH: ${{ github.workspace }}/infrastructure/secondary/cloudrecover-private-servers.pub
      BASTION_PUBLIC_KEY_PATH: ${{ github.workspace }}/infrastructure/secondary/cloudrecoveryV2.pub
      AMI_ID: ami-0bce970415466784a
      TF_WORKING_DIR: infrastructure/secondary
      AVAILABILITY_ZONE_1: eu-west-2a
      AVAILABILITY_ZONE_2: eu-west-2b
      VPC_NAME: cloud-recover-primary-vpc
      VPC_CIDR: 172.20.0.0/16
      PUBLIC_SUBNET_1_CIDR: 172.20.10.0/24
      PUBLIC_SUBNET_2_CIDR: 172.20.11.0/24
      APP_SUBNET_1_CIDR: 172.20.20.0/24
      APP_SUBNET_2_CIDR: 172.20.21.0/24
      MONITORING_SUBNET_1_CIDR: 172.20.30.0/24
      MONITORING_SUBNET_2_CIDR: 172.20.31.0/24
      DATABASE_SUBNET_1_CIDR: 172.20.40.0/24
      DATABASE_SUBNET_2_CIDR: 172.20.41.0/24
      PUBLIC_ROUTE_CIDR: 0.0.0.0/0
      PRIVATE_ROUTE_1_CIDR: 0.0.0.0/0
      PRIVATE_ROUTE_2_CIDR: 0.0.0.0/0
      PUBLIC_SUBNET_1_NAME: cloud-recover-pub-1
      PUBLIC_SUBNET_2_NAME: cloud-recover-pub-2
      APP_SUBNET_1_NAME: cloud-recover-app-1
      APP_SUBNET_2_NAME: cloud-recover-app-2
      MONITORING_SUBNET_1_NAME: cloud-recover-monitoring-1
      MONITORING_SUBNET_2_NAME: cloud-recover-monitoring-2
      DATABASE_SUBNET_1_NAME: cloud-recover-priv-1
      DATABASE_SUBNET_2_NAME: cloud-recover-priv-2
      INTERNET_GATEWAY_NAME: cloud-recover-IGW
      NAT_GATEWAY_1_EIP_NAME: nat-gateway-1-eip
      NAT_GATEWAY_2_EIP_NAME: nat-gateway-2-eip
      NAT_GATEWAY_1_NAME: cloud-recover-NGW-1
      NAT_GATEWAY_2_NAME: cloud-recover-NGW-2
      PUBLIC_ROUTE_TABLE_NAME: cloud-recover-pub-RT
      PRIVATE_ROUTE_TABLE_1_NAME: cloud-recover-priv-RT-1
      PRIVATE_ROUTE_TABLE_2_NAME: cloud-recover-priv-RT-2
      DATABASE_ROUTE_TABLE_NAME: cloud-recover-db-RT
      MY_IP: 143.105.152.193/32
      KEY_NAME: cloudrecover-primary-bastion-key
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

    defaults:
      run:
        working-directory: infrastructure/secondary

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Recovery Trigger
        run: |
          set -euo pipefail

          [[ -n "$PRIMARY_REGION" ]] || { echo "Source region is missing."; exit 1; }
          [[ -n "$DR_REGION" ]] || { echo "Recovery region is missing."; exit 1; }
          [[ -n "$TRIGGER_SOURCE" ]] || { echo "Trigger source is missing."; exit 1; }
          [[ -n "$ALARM_NAME" ]] || { echo "Alarm name is missing."; exit 1; }

          if [[ "$ALARM_NAME" != "cloudrecover-primary-health-alarm" ]]; then
            echo "Unexpected alarm: $ALARM_NAME"
            exit 1
          fi

          echo "Recovery trigger: $TRIGGER_SOURCE"
          echo "Alarm: $ALARM_NAME"
          echo "Source region: $PRIMARY_REGION"
          echo "Recovery region: $DR_REGION"
          echo "Terraform operation: ${{ inputs.action_type }}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.DR_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Validate Required Variables
        run: |
          set -euo pipefail

          [[ -n "$DR_REGION" ]] || {
            echo "DR_REGION is missing."
            exit 1
          }

          [[ -n "$AMI_ID" ]] || {
            echo "AMI_ID is missing."
            exit 1
          }

          [[ -n "$APP_PUBLIC_KEY_PATH" ]] || {
            echo "APP_PUBLIC_KEY_PATH is missing."
            exit 1
          }

          [[ -f "$APP_PUBLIC_KEY_PATH" ]] || {
            echo "SSH public key file not found: $APP_PUBLIC_KEY_PATH"
            exit 1
          }

          [[ -f "$BASTION_PUBLIC_KEY_PATH" ]] || {
            echo "Bastion SSH public key file not found: $BASTION_PUBLIC_KEY_PATH"
            exit 1
          }

          required_vars=(
            AVAILABILITY_ZONE_1 AVAILABILITY_ZONE_2 VPC_NAME VPC_CIDR
            PUBLIC_SUBNET_1_CIDR PUBLIC_SUBNET_2_CIDR
            APP_SUBNET_1_CIDR APP_SUBNET_2_CIDR
            MONITORING_SUBNET_1_CIDR MONITORING_SUBNET_2_CIDR
            DATABASE_SUBNET_1_CIDR DATABASE_SUBNET_2_CIDR
            PUBLIC_ROUTE_CIDR PRIVATE_ROUTE_1_CIDR PRIVATE_ROUTE_2_CIDR
            PUBLIC_SUBNET_1_NAME PUBLIC_SUBNET_2_NAME
            APP_SUBNET_1_NAME APP_SUBNET_2_NAME
            MONITORING_SUBNET_1_NAME MONITORING_SUBNET_2_NAME
            DATABASE_SUBNET_1_NAME DATABASE_SUBNET_2_NAME
            INTERNET_GATEWAY_NAME NAT_GATEWAY_1_EIP_NAME NAT_GATEWAY_2_EIP_NAME
            NAT_GATEWAY_1_NAME NAT_GATEWAY_2_NAME
            PUBLIC_ROUTE_TABLE_NAME PRIVATE_ROUTE_TABLE_1_NAME
            PRIVATE_ROUTE_TABLE_2_NAME DATABASE_ROUTE_TABLE_NAME MY_IP KEY_NAME
          )

          for name in "${required_vars[@]}"; do
            [[ -n "${!name}" ]] || {
              echo "$name is missing from GitHub Actions variables."
              exit 1
            }
          done

          [[ -n "$TF_VAR_db_username" ]] || { echo "DB_USERNAME is missing from GitHub Actions secrets."; exit 1; }
          [[ -n "$TF_VAR_db_password" ]] || { echo "DB_PASSWORD is missing from GitHub Actions secrets."; exit 1; }

          echo "Required Terraform variables are available."
          echo "Recovery region: $DR_REGION"
          echo "Application public key file exists."

      - name: Reuse or Copy Recovery Snapshot
        id: recovery_snapshot
        env:
          SOURCE_SNAPSHOT_IDENTIFIER: ${{ inputs.snapshot_identifier }}
        run: |
          set -euo pipefail

          RECOVERY_SNAPSHOT_IDENTIFIER="cloudrecover-recovery-snapshot"

          get_snapshot_status() {
            aws rds describe-db-snapshots \
              --region "$1" \
              --filters "Name=db-snapshot-id,Values=$2" \
              --query 'DBSnapshots[0].Status' \
              --output text
          }

          DESTINATION_STATUS=$(get_snapshot_status "$DR_REGION" "$RECOVERY_SNAPSHOT_IDENTIFIER")

          if [[ "$DESTINATION_STATUS" == "available" ]]; then
            echo "Reusing available snapshot $RECOVERY_SNAPSHOT_IDENTIFIER in $DR_REGION."
          else
            if [[ "$DESTINATION_STATUS" == "None" || -z "$DESTINATION_STATUS" ]]; then
              if [[ -z "$SOURCE_SNAPSHOT_IDENTIFIER" ]]; then
                echo "No source snapshot was supplied. Finding the latest available snapshot for DB instance $SOURCE_DB_INSTANCE_IDENTIFIER."

                SOURCE_SNAPSHOT_IDENTIFIER=$(aws rds describe-db-snapshots \
                  --region "$PRIMARY_REGION" \
                  --filters "Name=db-instance-id,Values=$SOURCE_DB_INSTANCE_IDENTIFIER" "Name=status,Values=available" \
                  --query 'sort_by(DBSnapshots, &SnapshotCreateTime)[-1].DBSnapshotIdentifier' \
                  --output text)

                if [[ "$SOURCE_SNAPSHOT_IDENTIFIER" == "None" || -z "$SOURCE_SNAPSHOT_IDENTIFIER" ]]; then
                  echo "No available source snapshot was found for DB instance $SOURCE_DB_INSTANCE_IDENTIFIER in $PRIMARY_REGION." >&2
                  exit 1
                fi

                echo "Selected latest available source snapshot: $SOURCE_SNAPSHOT_IDENTIFIER"
              fi

              SOURCE_STATUS=$(get_snapshot_status "$PRIMARY_REGION" "$SOURCE_SNAPSHOT_IDENTIFIER")

              if [[ "$SOURCE_STATUS" != "available" ]]; then
                echo "Source snapshot $SOURCE_SNAPSHOT_IDENTIFIER is not available in $PRIMARY_REGION (status: $SOURCE_STATUS)." >&2
                exit 1
              fi

              SOURCE_SNAPSHOT_ARN=$(aws rds describe-db-snapshots \
                --region "$PRIMARY_REGION" \
                --filters "Name=db-snapshot-id,Values=$SOURCE_SNAPSHOT_IDENTIFIER" \
                --query 'DBSnapshots[0].DBSnapshotArn' \
                --output text)

              echo "Copying $SOURCE_SNAPSHOT_IDENTIFIER from $PRIMARY_REGION to $DR_REGION as $RECOVERY_SNAPSHOT_IDENTIFIER."

              aws rds copy-db-snapshot \
                --source-db-snapshot-identifier "$SOURCE_SNAPSHOT_ARN" \
                --target-db-snapshot-identifier "$RECOVERY_SNAPSHOT_IDENTIFIER" \
                --source-region "$PRIMARY_REGION" \
                --region "$DR_REGION" \
                --copy-tags

            else
              echo "Recovery snapshot exists in $DR_REGION with status '$DESTINATION_STATUS'; waiting for it to become available."
            fi

            START_TIME=$(date +%s)

            while true; do
              DESTINATION_STATUS=$(get_snapshot_status "$DR_REGION" "$RECOVERY_SNAPSHOT_IDENTIFIER")

              if [[ "$DESTINATION_STATUS" == "available" ]]; then
                echo "Recovery snapshot $RECOVERY_SNAPSHOT_IDENTIFIER is available in $DR_REGION."
                break
              fi

              if [[ "$DESTINATION_STATUS" == "failed" || "$DESTINATION_STATUS" == "deleted" || "$DESTINATION_STATUS" == "None" ]]; then
                echo "Recovery snapshot copy cannot be used (status: $DESTINATION_STATUS)." >&2
                exit 1
              fi

              if (( $(date +%s) - START_TIME >= 18000 )); then
                echo "Timed out waiting for recovery snapshot to become available; last status: $DESTINATION_STATUS." >&2
                exit 1
              fi

              echo "Recovery snapshot status: $DESTINATION_STATUS. Checking again in 30 seconds."
              sleep 30
            done
          fi

          RECOVERY_POINT=$(aws rds describe-db-snapshots \
            --region "$DR_REGION" \
            --filters "Name=db-snapshot-id,Values=$RECOVERY_SNAPSHOT_IDENTIFIER" \
            --query 'DBSnapshots[0].SnapshotCreateTime' \
            --output text)

          echo "Terraform will restore recovery snapshot $RECOVERY_SNAPSHOT_IDENTIFIER, created at $RECOVERY_POINT."

          echo "snapshot_identifier=$RECOVERY_SNAPSHOT_IDENTIFIER" >> "$GITHUB_OUTPUT"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$TF_STATE_REGION" \
            -backend-config="use_lockfile=true"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: inputs.action_type == 'plan'
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -var="ami_id=$AMI_ID" \
            -var="region=$DR_REGION" \
            -var="availability_zone_1=$AVAILABILITY_ZONE_1" \
            -var="availability_zone_2=$AVAILABILITY_ZONE_2" \
            -var="vpc_name=$VPC_NAME" \
            -var="vpc_cidr=$VPC_CIDR" \
            -var="public_subnet_1_cidr=$PUBLIC_SUBNET_1_CIDR" \
            -var="public_subnet_2_cidr=$PUBLIC_SUBNET_2_CIDR" \
            -var="app_subnet_1_cidr=$APP_SUBNET_1_CIDR" \
            -var="app_subnet_2_cidr=$APP_SUBNET_2_CIDR" \
            -var="monitoring_subnet_1_cidr=$MONITORING_SUBNET_1_CIDR" \
            -var="monitoring_subnet_2_cidr=$MONITORING_SUBNET_2_CIDR" \
            -var="database_subnet_1_cidr=$DATABASE_SUBNET_1_CIDR" \
            -var="database_subnet_2_cidr=$DATABASE_SUBNET_2_CIDR" \
            -var="public_route_cidr=$PUBLIC_ROUTE_CIDR" \
            -var="private_route_1_cidr=$PRIVATE_ROUTE_1_CIDR" \
            -var="private_route_2_cidr=$PRIVATE_ROUTE_2_CIDR" \
            -var="public_subnet_1_name=$PUBLIC_SUBNET_1_NAME" \
            -var="public_subnet_2_name=$PUBLIC_SUBNET_2_NAME" \
            -var="app_subnet_1_name=$APP_SUBNET_1_NAME" \
            -var="app_subnet_2_name=$APP_SUBNET_2_NAME" \
            -var="monitoring_subnet_1_name=$MONITORING_SUBNET_1_NAME" \
            -var="monitoring_subnet_2_name=$MONITORING_SUBNET_2_NAME" \
            -var="database_subnet_1_name=$DATABASE_SUBNET_1_NAME" \
            -var="database_subnet_2_name=$DATABASE_SUBNET_2_NAME" \
            -var="internet_gateway_name=$INTERNET_GATEWAY_NAME" \
            -var="nat_gateway_1_eip_name=$NAT_GATEWAY_1_EIP_NAME" \
            -var="nat_gateway_2_eip_name=$NAT_GATEWAY_2_EIP_NAME" \
            -var="nat_gateway_1_name=$NAT_GATEWAY_1_NAME" \
            -var="nat_gateway_2_name=$NAT_GATEWAY_2_NAME" \
            -var="public_route_table_name=$PUBLIC_ROUTE_TABLE_NAME" \
            -var="private_route_table_1_name=$PRIVATE_ROUTE_TABLE_1_NAME" \
            -var="private_route_table_2_name=$PRIVATE_ROUTE_TABLE_2_NAME" \
            -var="database_route_table_name=$DATABASE_ROUTE_TABLE_NAME" \
            -var="my_ip=$MY_IP" \
            -var="key_name=$KEY_NAME" \
            -var="public_key_path=$BASTION_PUBLIC_KEY_PATH" \
            -var="app_public_key_path=$APP_PUBLIC_KEY_PATH" \
            -var="snapshot_identifier=${{ steps.recovery_snapshot.outputs.snapshot_identifier }}"

      - name: Terraform Apply
        if: inputs.action_type == 'apply'
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            -no-color \
            -var="ami_id=$AMI_ID" \
            -var="region=$DR_REGION" \
            -var="availability_zone_1=$AVAILABILITY_ZONE_1" \
            -var="availability_zone_2=$AVAILABILITY_ZONE_2" \
            -var="vpc_name=$VPC_NAME" \
            -var="vpc_cidr=$VPC_CIDR" \
            -var="public_subnet_1_cidr=$PUBLIC_SUBNET_1_CIDR" \
            -var="public_subnet_2_cidr=$PUBLIC_SUBNET_2_CIDR" \
            -var="app_subnet_1_cidr=$APP_SUBNET_1_CIDR" \
            -var="app_subnet_2_cidr=$APP_SUBNET_2_CIDR" \
            -var="monitoring_subnet_1_cidr=$MONITORING_SUBNET_1_CIDR" \
            -var="monitoring_subnet_2_cidr=$MONITORING_SUBNET_2_CIDR" \
            -var="database_subnet_1_cidr=$DATABASE_SUBNET_1_CIDR" \
            -var="database_subnet_2_cidr=$DATABASE_SUBNET_2_CIDR" \
            -var="public_route_cidr=$PUBLIC_ROUTE_CIDR" \
            -var="private_route_1_cidr=$PRIVATE_ROUTE_1_CIDR" \
            -var="private_route_2_cidr=$PRIVATE_ROUTE_2_CIDR" \
            -var="public_subnet_1_name=$PUBLIC_SUBNET_1_NAME" \
            -var="public_subnet_2_name=$PUBLIC_SUBNET_2_NAME" \
            -var="app_subnet_1_name=$APP_SUBNET_1_NAME" \
            -var="app_subnet_2_name=$APP_SUBNET_2_NAME" \
            -var="monitoring_subnet_1_name=$MONITORING_SUBNET_1_NAME" \
            -var="monitoring_subnet_2_name=$MONITORING_SUBNET_2_NAME" \
            -var="database_subnet_1_name=$DATABASE_SUBNET_1_NAME" \
            -var="database_subnet_2_name=$DATABASE_SUBNET_2_NAME" \
            -var="internet_gateway_name=$INTERNET_GATEWAY_NAME" \
            -var="nat_gateway_1_eip_name=$NAT_GATEWAY_1_EIP_NAME" \
            -var="nat_gateway_2_eip_name=$NAT_GATEWAY_2_EIP_NAME" \
            -var="nat_gateway_1_name=$NAT_GATEWAY_1_NAME" \
            -var="nat_gateway_2_name=$NAT_GATEWAY_2_NAME" \
            -var="public_route_table_name=$PUBLIC_ROUTE_TABLE_NAME" \
            -var="private_route_table_1_name=$PRIVATE_ROUTE_TABLE_1_NAME" \
            -var="private_route_table_2_name=$PRIVATE_ROUTE_TABLE_2_NAME" \
            -var="database_route_table_name=$DATABASE_ROUTE_TABLE_NAME" \
            -var="my_ip=$MY_IP" \
            -var="key_name=$KEY_NAME" \
            -var="public_key_path=$BASTION_PUBLIC_KEY_PATH" \
            -var="app_public_key_path=$APP_PUBLIC_KEY_PATH" \
            -var="snapshot_identifier=${{ steps.recovery_snapshot.outputs.snapshot_identifier }}"