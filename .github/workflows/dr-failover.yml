name: CloudRecover - DR Failover

on:
  workflow_dispatch:
    inputs:
      snapshot_identifier:
        description: 'RDS snapshot identifier to restore'
        required: true
        type: string

      action_type:
        description: 'Terraform operation'
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

      confirm_recovery:
        description: 'Confirm that this is an authorized recovery operation'
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: cloudrecover-recovery
  cancel-in-progress: false

env:
  PRIMARY_REGION: ${{ vars.PRIMARY_REGION }}
  DR_REGION: ${{ vars.DR_REGION }}
  TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
  TF_VERSION: ${{ vars.TF_VERSION }}
  TF_WORKING_DIR: infrastructure/secondary

jobs:
  dr-recovery:
    name: Execute DR Recovery
    runs-on: ubuntu-latest

    environment: recovery

    defaults:
      run:
        working-directory: infrastructure/secondary

    steps:
      - name: Validate Recovery Confirmation
        run: |
          if [[ "${{ inputs.confirm_recovery }}" != "true" ]]; then
            echo "Recovery confirmation is required."
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.DR_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Validate Recovery Snapshot
        run: |
          STATUS=$(aws rds describe-db-snapshots \
            --region "$DR_REGION" \
            --db-snapshot-identifier "${{ inputs.snapshot_identifier }}" \
            --query 'DBSnapshots[0].Status' \
            --output text)

          if [[ "$STATUS" != "available" ]]; then
            echo "Snapshot is not available. Current status: $STATUS"
            exit 1
          fi

          echo "Snapshot is available in $DR_REGION."

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$TF_STATE_REGION" \
            -backend-config="use_lockfile=true"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: inputs.action_type == 'plan'
        run: |
          terraform plan \
            -no-color \
            -var="region=$DR_REGION" \
            -var="snapshot_identifier=${{ inputs.snapshot_identifier }}"

      - name: Terraform Apply
        if: inputs.action_type == 'apply'
        run: |
          terraform apply \
            -auto-approve \
            -no-color \
            -var="region=$DR_REGION" \
            -var="snapshot_identifier=${{ inputs.snapshot_identifier }}"